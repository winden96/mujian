map $http_upgrade $mujian_connection_upgrade {
    default upgrade;
    ''      close;
}

upstream mujian_app {
    server 127.0.0.1:10088;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name www.mujianai.com mujianai.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://www.mujianai.com$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.mujianai.com;

    ssl_certificate /etc/letsencrypt/live/www.mujianai.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.mujianai.com/privkey.pem;
    ssl_session_cache shared:MujianTLS:10m;
    ssl_session_timeout 1d;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 32m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $mujian_connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_pass http://mujian_app;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name mujianai.com;

    ssl_certificate /etc/letsencrypt/live/www.mujianai.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.mujianai.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    return 301 https://www.mujianai.com$request_uri;
}
