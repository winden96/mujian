# IP HTTPS entry point. Browser navigation on the old HTTP port moves to HTTPS;
# existing API clients keep their routes while migrating their base URL.
map $http_upgrade $mujian_ip_connection_upgrade {
    default upgrade;
    ''      close;
}

map "$request_method:$http_accept" $mujian_ip_html_navigation {
    default 0;
    ~*^(GET|HEAD):.*text/html 1;
}

upstream mujian_ip_app {
    server 127.0.0.1:10090;
    keepalive 32;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    listen 10088;
    server_name 1.92.114.137;
    client_max_body_size 32m;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location = / {
        return 308 https://1.92.114.137$request_uri;
    }

    location / {
        if ($mujian_ip_html_navigation) {
            return 308 https://1.92.114.137$request_uri;
        }

        proxy_http_version 1.1;
        proxy_set_header Host 1.92.114.137;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto http;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $mujian_ip_connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_pass http://mujian_ip_app;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name 1.92.114.137;

    ssl_certificate /etc/letsencrypt-ip/live/1.92.114.137/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt-ip/live/1.92.114.137/privkey.pem;
    ssl_session_cache shared:MujianIPTLS:10m;
    ssl_session_timeout 1d;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 32m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location / {
        proxy_http_version 1.1;
        proxy_set_header Host 1.92.114.137;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $mujian_ip_connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_pass http://mujian_ip_app;
    }
}
